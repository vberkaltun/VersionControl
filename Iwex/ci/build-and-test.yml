parameters:
- name: solution
  type: string

steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    fetchTags: true
    lfs: true
    persistCredentials: true
    
  - task: NuGetToolInstaller@1
    displayName: 'Update NuGet'
    inputs:
      checkLatest: true

  - task: NuGetAuthenticate@0
    displayName: 'Authenticate with NuGet'

  - task: NuGetCommand@2
    displayName: Restore NuGet packages
    inputs:
      solution: '${{ parameters.solution }}'
      selectOrConfig: config
      nugetConfigPath: nuget.config

  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '9.0.x'

  - task: PowerShell@2
    displayName: 'Install GitVersion.Tool'
    inputs:
      targetType: 'inline'
      script: |
        dotnet tool install GitVersion.Tool --global --version 5.12
        # Add local tools to PATH
        $env:PATH += ";$(Build.SourcesDirectory)\.config\dotnet-tools"
        Write-Host "Updated PATH: $env:PATH"

  - task: PowerShell@2
    displayName: 'Run GitVersion'
    inputs:
      targetType: 'inline'
      script: |
        # Check if GitVersion is installed
        if ((Get-Command gitversion -ErrorAction SilentlyContinue)) {
            Write-Host "gitversion is installed."
            # Run GitVersion and log output
            gitversion -output file -outputfile "gitversion.json"
        }
        # Check if GitVersion is installed
        if ((Get-Command dotnet-gitversion -ErrorAction SilentlyContinue)) {
            Write-Host "dotnet-gitversion is installed."
            # Run GitVersion and log output
            dotnet-gitversion -output file -outputfile "gitversion.json"
        }

  - task: MSBuild@1
    inputs:
      solution: '**/*Applus IWEX.sln'
      msbuildArchitecture: 'x64'
      msbuildVersion: '17.0'
      platform: 'x64'
      configuration: 'release'
      msbuildArguments: >-
        -p:AppxBundle=Always
        -p:UapAppxPackageBuildMode=CI
        -p:AppxPackageDir="$(Build.ArtifactStagingDirectory)\\AppxPackages\\"
        -p:AppxBundlePlatforms=$(BuildPlatform)
        -p:AppxSymbolPackageEnabled=false
        -p:GenerateAppxPackageOnBuild=True
      clean: true
      restoreNugetPackages: true
      logProjectEvents: true